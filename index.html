<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distance Cost Calculator</title>
  <script defer src="js/costcalculator.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Distance Cost Calculator</h1>
  <form id="distanceForm">
    <label for="origin">Origin (lat,lon):</label>
    <input type="text" id="origin" name="origin" placeholder="e.g., 52.5200,13.4050" required>
    
    <label for="destination">Destination (lat,lon):</label>
    <input type="text" id="destination" name="destination" placeholder="e.g., 48.8566,2.3522" required>
    
    <label for="pricePerMile">Price per Mile (£):</label>
    <input type="number" id="pricePerMile" name="pricePerMile" step="0.01" placeholder="e.g., 1.50" required>
    
    <label for="bookingFee">Booking Fee (£):</label>
    <input type="number" id="bookingFee" name="bookingFee" step="0.01" placeholder="e.g., 5.00" required>
    
    <button type="submit">Calculate Cost</button>
  </form>
  
  <div class="result" id="result"></div>
</body>
</html>
